name: Publish GitHub RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version expected in package.json
        required: true
        default: 1.0.0-rc.0-reptilian.1
      tag:
        description: GitHub prerelease tag
        required: true
        default: v1.0.0-rc.0-reptilian.1
      confirm_release:
        description: Publish or update the public GitHub prerelease
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-reptilian-fastmcp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish GitHub release
    if: ${{ inputs.confirm_release && github.repository == 'ReptilianHQ/fastmcp-ts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Upgrade npm
        run: npm install --global npm@11.18.0

      - name: Verify release identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            if (packageJson.name !== "@reptilianhq/fastmcp-ts") throw new Error(`unexpected package: ${packageJson.name}`);
            if (packageJson.version !== process.env.EXPECTED_VERSION) throw new Error(`expected ${process.env.EXPECTED_VERSION}, found ${packageJson.version}`);
            if (process.env.EXPECTED_TAG !== `v${packageJson.version}`) throw new Error(`tag ${process.env.EXPECTED_TAG} does not match v${packageJson.version}`);
            if (packageJson.repository?.url !== "git+https://github.com/ReptilianHQ/fastmcp-ts.git") throw new Error("repository provenance mismatch");
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify publish artifact
        run: npm run prepublishOnly

      - name: Pack release artifact
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          sha256sum release-assets/*.tgz > release-assets/SHA256SUMS

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)
            if [ "$tag_type" = "tag" ]; then
              tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.type)
              tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)
            fi
            if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Refusing to publish assets: $RELEASE_TAG resolves to $tag_type $tag_sha, not commit $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "FastMCP $RELEASE_VERSION" \
              --generate-notes \
              --prerelease \
              release-assets/*.tgz \
              release-assets/SHA256SUMS
          fi
