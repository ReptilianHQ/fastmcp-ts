name: Publish Reptilian RC

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version expected in package.json
        required: true
        default: 1.0.0-rc.0-reptilian.0
      confirm_publish:
        description: Publish this version publicly to npm under the rc tag
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-reptilian-fastmcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    if: ${{ inputs.confirm_publish && github.repository == 'ReptilianHQ/fastmcp-ts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Verify release identity
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import packageJson from "./package.json" with { type: "json" };
            if (packageJson.name !== "@reptilianhq/fastmcp-ts") throw new Error(`unexpected package: ${packageJson.name}`);
            if (packageJson.version !== process.env.EXPECTED_VERSION) throw new Error(`expected ${process.env.EXPECTED_VERSION}, found ${packageJson.version}`);
            if (packageJson.repository?.url !== "git+https://github.com/ReptilianHQ/fastmcp-ts.git") throw new Error("repository provenance mismatch");
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify publish artifact
        run: npm run prepublishOnly

      - name: Publish public RC
        run: npm publish --access public --tag rc --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
